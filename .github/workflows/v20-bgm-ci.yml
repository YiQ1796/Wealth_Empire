name: V20 Audio Disabled CI

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "v20/**"
      - ".github/workflows/v20-bgm-ci.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  audio-disabled-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find v20/js -name '*.js' -type f | sort); do
            node --input-type=module --check < "$file"
          done

      - name: Validate audio is disabled
        shell: bash
        run: |
          set -euo pipefail
          grep -q '財富帝國 V20 Alpha 32.3.13' v20/index.html
          grep -q 'app.css?v=alpha32-237' v20/index.html
          grep -q 'main.js?v=alpha32-237' v20/index.html
          node --experimental-default-type=module v20/tests/bgm-controller.test.mjs

      - name: Run affected regressions
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module v20/tests/items-system.test.mjs
          node --experimental-default-type=module v20/tests/network-mobile-resilience.test.mjs
          node --experimental-default-type=module v20/tests/network-market-mobile-hotfix.test.mjs
          node --experimental-default-type=module v20/tests/anytime-stock-trading.test.mjs
          node --experimental-default-type=module v20/tests/entry-network-flow.test.mjs
          node --experimental-default-type=module v20/tests/desktop-readability.test.mjs
          node --experimental-default-type=module v20/tests/player-assets.test.mjs
          node --experimental-default-type=module v20/tests/acquisition-ui-priority.test.mjs
          node --experimental-default-type=module v20/tests/dual-relay-host.test.mjs
          node --experimental-default-type=module v20/tests/mobile-responsive.test.mjs
          node --experimental-default-type=module v20/tests/gameplay-systems.test.mjs
          node --experimental-default-type=module v20/tests/strategic-events-p1-p3.test.mjs
          node --experimental-default-type=module v20/tests/alpha32-3-13-rent-transport-ui.test.mjs
