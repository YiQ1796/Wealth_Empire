name: Deploy Wealth Empire to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand V20 central five assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v20/assets/center-v1
          rm -f \
            v20/assets/center-v1/CENTRAL_BANK.webp \
            v20/assets/center-v1/CENTRAL_MISSION.webp \
            v20/assets/center-v1/CENTRAL_TRANSIT.webp \
            v20/assets/center-v1/CENTRAL_INSURANCE.webp \
            v20/assets/center-v1/CENTRAL_DEVELOPMENT.webp
          python - <<'PY'
          from pathlib import Path
          import base64, binascii, struct, zlib

          parts = sorted(Path(".asset-packs/central-five-v1").glob("part*.b64"))
          if not parts:
              raise SystemExit("central five asset pack parts missing")

          payload = "".join(p.read_text(encoding="utf-8") for p in parts)
          payload = "".join(payload.split())
          payload += "=" * (-len(payload) % 4)
          raw = base64.b64decode(payload, validate=True)

          out_dir = Path("v20/assets/center-v1")
          required = {
              "CENTRAL_BANK.webp",
              "CENTRAL_MISSION.webp",
              "CENTRAL_TRANSIT.webp",
              "CENTRAL_INSURANCE.webp",
              "CENTRAL_DEVELOPMENT.webp",
          }

          offset = 0
          extracted = []
          while offset + 30 <= len(raw) and raw[offset:offset+4] == b"PK\x03\x04":
              (
                  _sig, _ver, flags, method, _mtime, _mdate,
                  crc32_expected, comp_size, uncomp_size, name_len, extra_len
              ) = struct.unpack_from("<IHHHHHIIIHH", raw, offset)

              if flags & 0x08:
                  raise SystemExit("unsupported zip data-descriptor entry")

              name_start = offset + 30
              name_end = name_start + name_len
              data_start = name_end + extra_len
              data_end = data_start + comp_size
              if data_end > len(raw):
                  raise SystemExit("truncated local zip entry")

              name = raw[name_start:name_end].decode("utf-8")
              comp = raw[data_start:data_end]
              if method == 0:
                  data = comp
              elif method == 8:
                  data = zlib.decompress(comp, -15)
              else:
                  raise SystemExit(f"unsupported zip method {method}: {name}")

              if len(data) != uncomp_size:
                  raise SystemExit(f"size mismatch: {name}")

              safe_name = Path(name).name
              if (binascii.crc32(data) & 0xffffffff) != crc32_expected:
                  raise SystemExit(f"crc mismatch: {name}")

              if safe_name in required:
                  (out_dir / safe_name).write_bytes(data)
                  extracted.append(safe_name)
                  if set(extracted) == required:
                      break

              offset = data_end

          missing = sorted(required - set(extracted))
          if missing:
              raise SystemExit("central five approved visuals missing: " + ", ".join(missing))

          print(f"Recovered {len(extracted)} approved central-five WebP assets from local ZIP entries")
          PY

          for asset in \
            CENTRAL_BANK.webp \
            CENTRAL_MISSION.webp \
            CENTRAL_TRANSIT.webp \
            CENTRAL_INSURANCE.webp \
            CENTRAL_DEVELOPMENT.webp
          do
            test -s "v20/assets/center-v1/$asset"
          done
          for sign in \
            TITLE_BANK.webp \
            TITLE_MISSION.webp \
            TITLE_TRANSIT.webp \
            TITLE_INSURANCE.webp \
            TITLE_DEVELOPMENT.webp
          do
            test -s "v20/assets/center-v1/$sign"
          done
          echo "Central buildings rebuilt and committed clean signs preserved PASS"

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/wealth_empire_inline.js").write_text("\n".join(inline), encoding="utf-8")
          print(f"Validated extraction: {len(inline)} inline script block(s)")
          PY
          node --check /tmp/wealth_empire_inline.js

      - name: Expand V20 V5 visual assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v20/assets/v5 v20/assets/tiles-v2
          mkdir -p v20/assets/v5
          unzip -oq v20/assets/packs/alpha18_v5_assets.zip -d v20/assets/v5

      - name: Validate V20 V5 visual assets
        shell: bash
        run: |
          set -euo pipefail
          test -s v20/assets/board/center-bg.webp

          for n in $(seq -w 1 44); do
            test -s "v20/assets/v5/tiles/TILE_${n}.webp"
          done
          test "$(find v20/assets/v5/tiles -maxdepth 1 -name 'TILE_*.webp' | wc -l)" -eq 44

          test "$(find v20/assets/v5/ui/houses -maxdepth 1 -name 'HOUSE_*.webp' | wc -l)" -eq 4
          test "$(find v20/assets/v5/ui/characters -maxdepth 1 -name 'PLAYER_*.webp' | wc -l)" -eq 16
          test "$(find v20/assets/v5/ui/badges -maxdepth 1 -name '*.webp' | wc -l)" -eq 15
          test "$(find v20/assets/v5/ui/modal -maxdepth 1 -name '*.webp' | wc -l)" -eq 11

          test "$(find v20/assets/v5/notification/cards -maxdepth 1 -name '*.webp' | wc -l)" -eq 4
          test "$(find v20/assets/v5/notification/icons -maxdepth 1 -name '*.webp' | wc -l)" -eq 13
          test "$(find v20/assets/v5/notification/effects -maxdepth 1 -name '*.webp' | wc -l)" -eq 7
          test "$(find v20/assets/v5/notification/market -maxdepth 1 -name '*.webp' | wc -l)" -eq 2

          test -s v20/assets/v5/ui/modal/MODAL_CLOSE.webp
          test -s v20/assets/v5/ui/badges/BADGE_NO_ACQUISITION.webp
          test -s v20/assets/v5/notification/cards/NOTIFY_CARD_MAJOR_DESKTOP.webp
          test -s v20/assets/v5/notification/icons/NOTIFY_ICON_PROPERTY_BUY.webp

          if [ -e v20/assets/tiles-v2 ]; then
            echo "Legacy tiles-v2 render directory must not exist"
            exit 1
          fi

          for legacy in \
            v20/assets/ui/PAWN_BLUE.webp \
            v20/assets/ui/PAWN_RED.webp \
            v20/assets/ui/PAWN_GREEN.webp \
            v20/assets/ui/PAWN_PURPLE.webp \
            v20/assets/ui/QUICK_STOCK.webp \
            v20/assets/ui/QUICK_PROPERTY.webp \
            v20/assets/ui/QUICK_ITEM.webp \
            v20/assets/ui/QUICK_INFO.webp
          do
            if [ -e "$legacy" ]; then
              echo "Legacy V20 render source still exists: $legacy"
              exit 1
            fi
          done

          if grep -R -nE 'tile__owner|tile__level' v20/js v20/index.html v20/styles/app.css; then
            echo "Legacy board owner/level visual source must not coexist with V5 houses"
            exit 1
          fi

          if grep -nE '^\\.action-toast__icon\\{|border-left:5px solid #457fb2' v20/styles/app.css; then
            echo "Legacy Alpha17 toast-specific render source must not coexist with Alpha18 notification cards"
            exit 1
          fi

          echo "V20 Alpha18 V5 visual assets PASS: 44 tiles + houses + 16 character states + badges + modal + notification UI"

      - name: Validate V20 persistent stock HUD
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="desktop-stock-panel"' v20/index.html
          grep -q 'id="stockMarketGrid"' v20/index.html
          grep -q 'stock-summary' v20/js/ui/stock-render.js
          grep -q 'stock-holding-row' v20/js/ui/stock-render.js
          grep -q 'stock-pnl-row' v20/js/ui/stock-render.js
          grep -q 'stock-pair-row' v20/js/ui/stock-render.js
          grep -q '.stock-summary{' v20/styles/app.css
          grep -q '.stock-holding-row{' v20/styles/app.css
          grep -q '.stock-pnl-row{' v20/styles/app.css
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' v20/styles/app.css
          grep -q 'app.css?v=alpha32-223' v20/index.html
          grep -q 'main.js?v=alpha32-223' v20/index.html

          if grep -q 'data-feature="stock"' v20/index.html; then
            echo "Desktop stock market must not return as a shortcut"
            exit 1
          fi

          if grep -q 'data-feature-panel="stock"' v20/index.html; then
            echo "Desktop stock market must remain persistent instead of modal-only"
            exit 1
          fi

          echo "V20 reference-based persistent stock HUD PASS"

      - name: Validate V20 board-center visual layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'board.appendChild(actionToastStack)' v20/js/main.js
          grep -q 'position:absolute' v20/styles/app.css
          grep -q 'width:min(760px,calc(100% - 48px))' v20/styles/app.css

          if grep -q 'Reduce central notifications so they no longer dominate the map' v20/styles/app.css; then
            echo "Notification size must not be reduced; only its board-relative position may change"
            exit 1
          fi

          echo "V20 board-center visual layout PASS"

      - name: Validate V20 uniform board grid
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'grid-template-columns:repeat(13,minmax(0,1fr))' v20/styles/app.css
          grep -q 'grid-template-rows:repeat(11,minmax(0,1fr))' v20/styles/app.css
          grep -q 'left:-6%' v20/styles/app.css
          grep -q 'top:-6%' v20/styles/app.css
          grep -q 'width:112%' v20/styles/app.css
          grep -q 'height:112%' v20/styles/app.css

          if grep -qE 'tile\.edge-(top|bottom|left|right)|edgeClasses\.push|\.tile\.(horizontal|vertical|corner) img\.tile-art' v20/styles/app.css v20/js/ui/render.js; then
            echo "Board tiles must use one uniform grid and one uniform image sizing rule"
            exit 1
          fi

          echo "V20 uniform 13x11 board grid and uniform tile crop PASS"

      - name: Validate V20 two-line dice HUD
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="diceFacesValue"' v20/index.html
          grep -q 'id="diceTotalValue"' v20/index.html
          grep -q 'diceFacesValue.textContent="🎲 "' v20/js/ui/render.js
          grep -q 'diceTotalValue.textContent="= "' v20/js/ui/render.js
          grep -q '.control-actions--turn .action-button span' v20/styles/app.css
          grep -q 'white-space:nowrap' v20/styles/app.css

          if grep -q 'id="diceValue"' v20/index.html v20/js/ui/render.js; then
            echo "Legacy one-line dice result must not remain"
            exit 1
          fi

          echo "V20 two-line dice HUD PASS"

      - name: Validate in-game network row removed
        shell: bash
        run: |
          set -euo pipefail

          if grep -qE 'network-strip|networkStatusBar|openNetworkButton' v20/index.html v20/js/main.js; then
            echo "Single-player/network mode selection belongs to the entry flow, not the in-game HUD"
            exit 1
          fi

          echo "V20 in-game network row removal PASS"

      - name: Validate V20 notification detail cards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'action-toast__metric' v20/js/main.js
          grep -q 'action-toast__details' v20/js/main.js
          grep -q 'property_buy:{title:"地產購入"' v20/js/main.js
          grep -q 'stock_sell:{title:"股票賣出"' v20/js/main.js
          grep -q 'min-height:172px' v20/styles/app.css
          grep -q '.action-toast__metric{' v20/styles/app.css
          grep -q '.action-toast__details{' v20/styles/app.css

          if grep -q 'action-toast__shine' v20/js/main.js v20/styles/app.css; then
            echo "Legacy notification divider/shine layer must not remain"
            exit 1
          fi

          echo "V20 notification detail cards PASS"

      - name: Validate V20 gameplay minigames and special events
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name:"財富賽馬"' v20/js/data/minigames.js
          grep -q 'name:"黃金寶箱"' v20/js/data/minigames.js
          grep -q 'name:"財富猜拳"' v20/js/data/minigames.js
          grep -q 'name:"幸運 21 點"' v20/js/data/minigames.js
          grep -q 'name:"財富彈珠"' v20/js/data/minigames.js
          grep -q 'name:"搶錢拍賣"' v20/js/data/minigames.js
          grep -q 'name:"瘋狂蝸牛賽跑"' v20/js/data/minigames.js
          grep -q 'startHorse(session)' v20/js/ui/minigame-ui.js
          grep -q 'startSnail(session)' v20/js/ui/minigame-ui.js
          grep -q '偷偷坐上火箭' v20/js/ui/minigame-ui.js
          grep -q '放屁衝鋒' v20/js/ui/minigame-ui.js
          grep -q '看到帥哥分心' v20/js/ui/minigame-ui.js
          grep -q '作弊偷跑' v20/js/ui/minigame-ui.js
          grep -q 'resolveSpecialEvent' v20/js/core/game.js
          grep -q 'chance_bonus' v20/js/data/special-events.js
          grep -q 'fate_patron' v20/js/data/special-events.js
          grep -q 'specialEventHistory' v20/js/core/state.js
          grep -q 'tile.type==="horse"' v20/js/core/game.js
          grep -q '?"horse"' v20/js/core/game.js
          grep -q 'tile.type==="auction"' v20/js/core/game.js
          grep -q 'resolveCivicEvent(this.state,player,"auction")' v20/js/core/game.js
          grep -q 'startMinigame(this.state,player.seat,Date.now(),"auction")' v20/js/core/game.js
          grep -q 'V20 Alpha 24 — gameplay minigames' v20/styles/app.css

          if grep -qE 'name:"幸運快遞"|name:"幸運樓層"|name:"命運翻牌"|name:"城市岔路"|name:"商圈開盤"' v20/js/data/minigames.js; then
            echo "Legacy luck-only minigame pool must not remain active"
            exit 1
          fi

          echo "V20 Alpha24 distinct minigames and functional chance/fate events PASS"

      - name: Validate V20 transport system
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="transportDialog"' v20/index.html
          grep -q 'id="transportDestinationList"' v20/index.html
          grep -Fq 'TRANSPORT_NODE_INDEXES=Object.freeze([10,13,32,43])' v20/js/data/transport.js
          grep -q 'createPendingTransport' v20/js/core/transport.js
          grep -q 'state.phase="transport"' v20/js/core/game.js
          grep -q 'useTransport(destinationIndex' v20/js/core/game.js
          grep -q 'skipTransport(seat' v20/js/core/game.js
          grep -q '"transport_travel"' v20/js/core/network.js
          grep -q '"transport_skip"' v20/js/core/network.js
          grep -q 'function renderTransportDialog' v20/js/main.js
          grep -q 'V20 Alpha 25 — functional transport system' v20/styles/app.css
          node --experimental-default-type=module v20/tests/gameplay-systems.test.mjs
          echo "V20 Alpha25 transport routing and multiplayer authority PASS"

      - name: Validate V20 acquisition and race polish
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="acquisitionDialog"' v20/index.html
          grep -q 'createPendingAcquisition' v20/js/core/acquisition-center.js
          grep -q 'executeAcquisition' v20/js/core/acquisition-center.js
          grep -q 'state.phase="acquisition"' v20/js/core/game.js
          grep -q 'acquireFromCenter(tileIndex' v20/js/core/game.js
          grep -q '"acquisition_buy"' v20/js/core/network.js
          grep -q '"acquisition_skip"' v20/js/core/network.js
          grep -q 'tile.type==="auction"' v20/js/core/game.js
          grep -q 'continuous:true' v20/js/ui/minigame-ui.js
          grep -q 'requestAnimationFrame(frame)' v20/js/ui/minigame-ui.js
          grep -q 'V20 Alpha 26 — acquisition center + continuous race presentation' v20/styles/app.css
          node --experimental-default-type=module v20/tests/race-animation.test.mjs
          node --experimental-default-type=module v20/tests/gameplay-systems.test.mjs
          echo "V20 Alpha26 acquisition, bridge, auction and continuous race PASS"

      - name: Validate V20 completed special grids
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="urbanDialog"' v20/index.html
          grep -q 'name:"高低骰對決"' v20/js/data/minigames.js
          grep -q 'randomEligible:false' v20/js/data/minigames.js
          grep -q 'highlow:()=>this.startHighLow(session)' v20/js/ui/minigame-ui.js
          grep -q 'resolveCivicEvent' v20/js/core/game.js
          grep -q 'CIVIC_EVENT_POOLS' v20/js/data/civic-events.js
          grep -q 'state.phase="urban"' v20/js/core/game.js
          grep -q 'useUrban(destinationIndex' v20/js/core/game.js
          grep -q '"urban_move"' v20/js/core/network.js
          grep -q '"urban_skip"' v20/js/core/network.js
          grep -q 'taxEventShield' v20/js/core/civic-specials.js
          grep -q 'medicalMoveShield' v20/js/core/civic-specials.js
          grep -q 'courtShieldUntilRound' v20/js/core/civic-specials.js
          grep -q 'V20 Alpha 27 — remaining special-grid completion' v20/styles/app.css
          node --experimental-default-type=module v20/tests/gameplay-systems.test.mjs
          echo "V20 Alpha31 high-low and varied civic special grids PASS"

      - name: Validate V20 central five facilities
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-central-facility="bank"' v20/index.html
          grep -q 'data-central-facility="mission"' v20/index.html
          grep -q 'data-central-facility="transit"' v20/index.html
          grep -q 'data-central-facility="insurance"' v20/index.html
          grep -q 'data-central-facility="development"' v20/index.html
          grep -q 'centralBankDeposit' v20/js/core/state.js
          grep -q 'central_bank_deposit' v20/js/core/network.js
          grep -q 'central_mission_accept' v20/js/core/network.js
          grep -q 'central_transit' v20/js/core/network.js
          grep -q 'central_insurance' v20/js/core/network.js
          grep -q 'central_development' v20/js/core/network.js
          grep -q 'function renderCentralFacilities' v20/js/main.js
          grep -q 'central-facility__sign' v20/index.html
          grep -q 'TITLE_BANK.webp' v20/index.html
          grep -q 'TITLE_MISSION.webp' v20/index.html
          grep -q 'TITLE_TRANSIT.webp' v20/index.html
          grep -q 'TITLE_INSURANCE.webp' v20/index.html
          grep -q 'TITLE_DEVELOPMENT.webp' v20/index.html
          grep -q 'V20 Alpha 29 — stronger actionable states and smaller central buildings' v20/styles/app.css
          grep -q 'V20 Alpha 28 — central five facilities' v20/styles/app.css
          grep -q 'V20 Alpha 29 — stronger actionable states and smaller central buildings' v20/styles/app.css
          test -s v20/assets/center-v1/CENTRAL_BANK.webp
          node --experimental-default-type=module v20/tests/central-features.test.mjs
          node --experimental-default-type=module v20/tests/network-mobile-regression.test.mjs
          echo "V20 Alpha29 central five facilities, bank plans, assets and mobile relay PASS"

      - name: Validate V20 character ownership and contiguous regions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-character-choice="0"' v20/index.html
          grep -q 'data-character-choice="3"' v20/index.html
          grep -q 'setPlayerCharacter' v20/js/main.js
          grep -q 'characterIndex' v20/js/core/state.js
          grep -q 'characterIndex' v20/js/core/network.js
          grep -q 'tile--owned' v20/js/ui/render.js
          grep -q '.tile.tile--owned::after' v20/styles/app.css
          grep -q 'groupsAreContiguous' v20/js/data/board.js
          grep -q 'TILE_ART_ORDER' v20/js/data/assets.js
          grep -q 'font-size:13px' v20/styles/app.css
          grep -q 'font-size:19px' v20/styles/app.css
          echo "V20 character selection, owner-color borders, larger stocks and contiguous regions PASS"

      - name: Validate V20 board pawn and house sizing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'left:50%' v20/styles/app.css
          grep -q 'top:50%' v20/styles/app.css
          grep -q 'width:clamp(30px,2.05vw,38px)' v20/styles/app.css
          grep -q 'justify-content:space-evenly' v20/styles/app.css
          grep -q 'width:clamp(22px,1.75vw,30px)' v20/styles/app.css

          if grep -q 'pawn-token{width:18px;height:18px}' v20/styles/app.css; then
            echo "Legacy tiny mobile pawn rule must not remain"
            exit 1
          fi

          if grep -q 'tile.vertical .property-house' v20/styles/app.css; then
            echo "Vertical tiles must not shrink property houses"
            exit 1
          fi

          echo "V20 larger centered pawns and evenly-spaced houses PASS"

      - name: Validate V20 mixed region board rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"海港區":2' v20/js/data/board.js
          grep -q '"商業區":4' v20/js/data/board.js
          grep -q '"科技區":3' v20/js/data/board.js
          grep -q '"豪宅區":4' v20/js/data/board.js
          grep -q '"帝王區":2' v20/js/data/board.js
          grep -q '"商業區":2.00' v20/js/data/board.js
          grep -q '"科技區":1.50' v20/js/data/board.js
          grep -q '"海港區":1.25' v20/js/data/board.js
          grep -q 'cornerTilesAreSpecial' v20/js/data/board.js
          grep -q 'duplicateAdjacentEventTypes' v20/js/data/board.js
          echo "V20 mixed 2/3/4 regions, special corners and separated event types PASS"

      - name: Validate V20 mobile landscape authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="mobile-primary-actions"' v20/index.html
          grep -q 'id="mobileRollButton"' v20/index.html
          grep -q 'data-feature="market"' v20/index.html
          grep -q 'id="stockMarketMobileGrid"' v20/index.html
          grep -q 'stockMarketMobileGrid' v20/js/main.js
          grep -q 'mobileRollButton.disabled=rollDisabled' v20/js/ui/render.js
          grep -q 'V20 Alpha 19 — phone landscape authority' v20/styles/app.css
          grep -q 'V20 Alpha 29.1 — phone board fill tuning' v20/styles/app.css
          grep -q 'orientation:landscape' v20/styles/app.css
          grep -q 'grid-template-columns:minmax(0,1fr) clamp(242px,27.5vw,286px)' v20/styles/app.css
          grep -q '.desktop-stock-panel{' v20/styles/app.css
          grep -q 'env(safe-area-inset-left)' v20/styles/app.css
