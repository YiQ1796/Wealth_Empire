name: Deploy Wealth Empire to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/wealth_empire_inline.js").write_text("\n".join(inline), encoding="utf-8")
          print(f"Validated extraction: {len(inline)} inline script block(s)")
          PY
          node --check /tmp/wealth_empire_inline.js

      - name: Build V20 visual assets
        shell: bash
        run: |
          set -euo pipefail
          PACK="v20/assets/packs/alpha2-assets.zip"
          TMP="$(mktemp -d)"
          test -s "$PACK"
          mkdir -p v20/assets/board v20/assets/tiles
          unzip -q "$PACK" -d "$TMP"
          test -s "$TMP/center-bg.png"
          mv "$TMP/center-bg.png" v20/assets/board/center-bg.png
          for file in \
            WE_T11_WATERFRONT_VILLA_V2.png \
            WE_T12_SEA_SKY_GARDEN_V2.png \
            WE_T13_EMERALD_SHOPPING_V2.png \
            WE_T14_GOLDEN_SHOPPING_V2.png \
            WE_T15_DEPARTMENT_STORE_V2.png \
            WE_T16_CINEMA_V2.png \
            WE_T17_TECH_PARK_V2.png \
            WE_T18_INNOVATION_PARK_V2.png \
            WE_T19_CLOUD_TECH_CITY_V2.png \
            WE_T20_NORTH_CITY_MANSION_V2.png
          do
            test -s "$TMP/$file"
            mv "$TMP/$file" v20/assets/tiles/"$file"
          done
          test "$(find v20/assets/tiles -maxdepth 1 -name 'WE_T*.png' | wc -l)" -eq 10
          echo "V20 visual assets: center background + 10 complete-tile PNGs PASS"

      - name: Validate V20 module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find v20/js -name '*.js' -type f | sort); do
            node --input-type=module --check < "$file"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
