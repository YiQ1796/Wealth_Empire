name: Deploy Wealth Empire to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/wealth_empire_inline.js").write_text("\n".join(inline), encoding="utf-8")
          print(f"Validated extraction: {len(inline)} inline script block(s)")
          PY
          node --check /tmp/wealth_empire_inline.js

      - name: Validate V20 V5 visual source
        shell: bash
        run: |
          set -euo pipefail
          test -s v20/assets/board/center-bg.webp
          test -s v20/assets/ui/ACTION_ROLL.webp
          test -s v20/assets/ui/ACTION_END_TURN.webp
          node --experimental-default-type=module v20/tests/v5-assets.test.mjs
          if grep -R "assets/tiles-v2\|QUICK_STOCK\|QUICK_PROPERTY\|QUICK_ITEM\|QUICK_INFO\|PAWN_BLUE\|PAWN_RED\|PAWN_GREEN\|PAWN_PURPLE" v20/js v20/index.html; then
            echo "Legacy V20 render source reference detected"
            exit 1
          fi
          echo "V20 V5 visual source PASS: Batch01-09 is the only tile/house/character/modal/badge source"

      - name: Validate V20 module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find v20/js -name '*.js' -type f | sort); do
            node --input-type=module --check < "$file"
          done

      - name: Validate V20 property economy
        shell: bash
        run: |
          node --experimental-default-type=module v20/tests/property-economy.test.mjs

      - name: Validate V20 gameplay systems
        shell: bash
        run: |
          node --experimental-default-type=module v20/tests/gameplay-systems.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
