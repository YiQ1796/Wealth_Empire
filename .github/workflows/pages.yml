name: Deploy Wealth Empire to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline script found")
          Path("/tmp/wealth_empire_inline.js").write_text("\n".join(inline), encoding="utf-8")
          print(f"Validated extraction: {len(inline)} inline script block(s)")
          PY
          node --check /tmp/wealth_empire_inline.js

      - name: Expand V20 tile art
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v20/assets/tiles-v2
          mkdir -p v20/assets/tiles-v2
          for pack in             v20/assets/packs/tiles_01_10.zip             v20/assets/packs/tiles_11_20.zip             v20/assets/packs/tiles_21_30.zip             v20/assets/packs/tiles_31_36.zip
          do
            unzip -oq "$pack" -d v20/assets/tiles-v2
          done

      - name: Validate V20 visual assets
        shell: bash
        run: |
          set -euo pipefail
          test -s v20/assets/board/center-bg.webp
          for n in $(seq -w 1 36); do
            test -s "v20/assets/tiles-v2/TILE_${n}.webp"
          done
          test "$(find v20/assets/tiles-v2 -maxdepth 1 -name 'TILE_*.webp' | wc -l)" -eq 36
          echo "V20 visual assets: center background + 36 complete-tile WebPs PASS"

      - name: Validate V20 module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find v20/js -name '*.js' -type f | sort); do
            node --input-type=module --check < "$file"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
