<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef3f7">
<title>財富帝國 V20 Alpha 14</title>
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
<main class="app-shell">
  <section class="game-layout">
    <div class="board-panel">
      <div id="board" class="board" aria-label="財富帝國棋盤">
        <div id="centerStage" class="center-stage">
          <img id="centerBackground" alt="" aria-hidden="true">
          <div class="center-stage__shade"></div>
          <div class="center-stage__content">
            <h2>都會核心</h2>
            <p id="statusText">等待擲骰。</p>
          </div>
        </div>
      </div>
    </div>

    <aside class="hud-panel" aria-label="玩家與功能資訊">
      <header class="hud-header">
        <div>
          <h1>玩家資訊</h1>
          <div class="round-inline">ROUND <strong id="roundValue">1</strong> / 30</div>
        </div>
        <div class="dice-result">🎲 <strong id="diceValue">—</strong></div>
      </header>

      <section id="players" class="players" aria-label="玩家資訊"></section>

      <div class="control-actions">
        <button id="rollButton" class="action-button action-button--primary">
          <img src="./assets/ui/ACTION_ROLL.webp" alt="">
          <span>擲骰子</span>
        </button>
        <button id="endTurnButton" class="action-button">
          <img src="./assets/ui/ACTION_END_TURN.webp" alt="">
          <span>結束回合</span>
        </button>
      </div>

      <nav class="feature-tabs" aria-label="功能切換">
        <button class="feature-tab active" data-tab="stock" aria-selected="true">
          <img src="./assets/ui/QUICK_STOCK.webp" alt=""><span>股票</span>
        </button>
        <button class="feature-tab" data-tab="property" aria-selected="false">
          <img src="./assets/ui/QUICK_PROPERTY.webp" alt=""><span>房產</span>
        </button>
        <button class="feature-tab" data-tab="item" aria-selected="false">
          <img src="./assets/ui/QUICK_ITEM.webp" alt=""><span>道具</span>
        </button>
        <button class="feature-tab" data-tab="info" aria-selected="false">
          <img src="./assets/ui/QUICK_INFO.webp" alt=""><span>資訊</span>
        </button>
      </nav>

      <section class="feature-body">
        <div class="feature-pane active" data-pane="stock">
          <div class="feature-heading">
            <div><h2>股票資訊</h2><p>本回合行情</p></div>
            <span class="market-badge">開盤</span>
          </div>
          <div id="stockTabGrid" class="stock-grid stock-grid--rail"></div>
        </div>

        <div class="feature-pane" data-pane="property">
          <div class="feature-heading"><div><h2>我的房產</h2><p>持有土地與租金</p></div></div>
          <div id="propertyTabList" class="property-list"></div>
        </div>

        <div class="feature-pane" data-pane="item">
          <div class="feature-heading"><div><h2>策略道具</h2><p>可用時會主動提示</p></div></div>
          <div class="empty-state">目前尚未持有策略道具。</div>
        </div>

        <div class="feature-pane" data-pane="info">
          <div class="feature-heading"><div><h2>回合資訊</h2><p>目前格子與即時事件</p></div></div>
          <div id="currentTileInfo" class="tile-info">—</div>
          <div id="eventLog" class="event-log"></div>
        </div>
      </section>
    </aside>
  </section>
</main>

<dialog id="purchaseDialog" class="purchase-dialog">
  <div class="purchase-card">
    <img class="purchase-card__icon" src="./assets/ui/QUICK_PROPERTY.webp" alt="">
    <h2 id="purchaseTitle">購買地產？</h2>
    <p id="purchaseSubtitle">—</p>
    <div class="purchase-summary">
      <div><span>售價</span><strong id="purchasePrice">—</strong></div>
      <div><span>目前現金</span><strong id="purchaseCash">—</strong></div>
    </div>
    <div class="purchase-actions">
      <button id="declinePurchaseButton" class="purchase-button secondary">不購買</button>
      <button id="confirmPurchaseButton" class="purchase-button confirm">購買</button>
    </div>
  </div>
</dialog>

<script type="module" src="./js/main.js"></script>
</body>
</html>
