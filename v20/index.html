<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3ead3">
<title>財富帝國 V20 Alpha 8</title>
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div>
      <h1>財富帝國 <span>V20 Alpha 8</span></h1>
      <p>36 格｜28 地產｜8 事件｜乾淨重製線</p>
    </div>
    <div class="round-badge">ROUND <strong id="roundValue">1</strong> / 30</div>
  </header>

  <section class="game-layout">
    <div class="board-panel">
      <div id="board" class="board" aria-label="財富帝國棋盤">
        <div id="centerStage" class="center-stage">
          <img id="centerBackground" alt="" aria-hidden="true">
          <div class="center-stage__shade"></div>
          <div class="center-stage__content">
            <h2>都會核心</h2>
            <p id="statusText">等待擲骰。</p>
          </div>
        </div>
      </div>
    </div>

    <aside class="right-rail" aria-label="玩家與回合控制">
      <section class="control-panel">
      <div class="control-panel__header">
        <div>
          <h2>回合控制</h2>
          <p>目前玩家與操作</p>
        </div>
        <div class="dice-result">🎲 <strong id="diceValue">—</strong></div>
      </div>

      <section id="players" class="players compact-players" aria-label="玩家資訊"></section>

      <div class="control-actions">
        <button id="rollButton" class="action-button primary">🎲 擲骰子</button>
        <button id="buyButton" class="action-button" disabled>🏠 購買地產</button>
        <button id="endTurnButton" class="action-button" disabled>➡️ 結束回合</button>
      </div>
      </section>

      <nav class="quick-dock" aria-label="快捷功能">
        <button class="quick-button" data-dialog="stockDialog">📈<span>股票</span></button>
        <button class="quick-button" data-dialog="propertyDialog">🏠<span>房產</span></button>
        <button class="quick-button" data-dialog="strategyDialog">🎴<span>道具</span></button>
        <button class="quick-button" data-dialog="infoDialog">ℹ️<span>資訊</span></button>
      </nav>
    </aside>
  </section>
</main>

<dialog id="stockDialog" class="game-dialog">
  <div class="dialog-shell dialog-shell--wide">
    <header class="dialog-header">
      <div>
        <h2>股票市場</h2>
        <p>本回合行情</p>
      </div>
      <button class="dialog-close" data-close-dialog aria-label="關閉">✕</button>
    </header>
    <div id="stockGrid" class="stock-grid"></div>
  </div>
</dialog>

<dialog id="propertyDialog" class="game-dialog">
  <div class="dialog-shell">
    <header class="dialog-header">
      <div>
        <h2>我的房產</h2>
        <p>土地、價值與區域狀態</p>
      </div>
      <button class="dialog-close" data-close-dialog aria-label="關閉">✕</button>
    </header>
    <div id="propertyList" class="property-list"></div>
  </div>
</dialog>

<dialog id="strategyDialog" class="game-dialog">
  <div class="dialog-shell">
    <header class="dialog-header">
      <div>
        <h2>策略道具</h2>
        <p>符合條件時會主動提示使用</p>
      </div>
      <button class="dialog-close" data-close-dialog aria-label="關閉">✕</button>
    </header>
    <div class="empty-state">目前尚未持有策略道具。</div>
  </div>
</dialog>

<dialog id="infoDialog" class="game-dialog">
  <div class="dialog-shell">
    <header class="dialog-header">
      <div>
        <h2>回合資訊</h2>
        <p>目前格子與即時事件</p>
      </div>
      <button class="dialog-close" data-close-dialog aria-label="關閉">✕</button>
    </header>
    <section class="dialog-section">
      <h3>目前格子</h3>
      <div id="currentTileInfo" class="tile-info">—</div>
    </section>
    <section class="dialog-section">
      <h3>即時事件</h3>
      <div id="eventLog" class="event-log"></div>
    </section>
  </div>
</dialog>

<script type="module" src="./js/main.js"></script>
</body>
</html>
